apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-app-33
  namespace: pki-tenant-large-tier-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workload-app-33
  template:
    metadata:
      labels:
        app: workload-app-33
    spec:
      containers:
      - name: app
        image: nginx:latest

        envFrom:
        - configMapRef:
            name: demo-cm-1
        - secretRef:
            name: demo-secret-1
        resources:
          limits:
            cpu: "100m"
            memory: "64Mi"
          requests:
            cpu: "2m"
            memory: "32Mi"
---
