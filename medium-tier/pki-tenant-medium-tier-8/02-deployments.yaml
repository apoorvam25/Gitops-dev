apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-app-52
  namespace: pki-tenant-medium-tier-8
spec:
  replicas: 11
  selector:
    matchLabels:
      app: workload-app-52
  template:
    metadata:
      labels:
        app: workload-app-52
    spec:
      containers:
      - name: app
        image: nginx:latest

        envFrom:
        - configMapRef:
            name: demo-cm-1
        - secretRef:
            name: demo-secret-1
        resources:
          limits:
            cpu: "100m"
            memory: "64Mi"
          requests:
            cpu: "10m"
            memory: "32Mi"
---
